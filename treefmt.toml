# The single formatting entry point for this repository.
#
# A copy of dotfiles' treefmt.toml, .prettierrc.yaml and
# .markdownlint-cli2.yaml (corygyarmathy/dotfiles@95648a3), cut down to the
# file types this repository has and with its excludes re-pointed at the paths
# here. Deduplicating the three copies across repositories is deliberately
# out of scope (corygyarmathy/dotfiles#365); until then, a change to a rule
# there is copied here by hand.
#
# `nix fmt` formats the tree; `nix fmt -- --ci` is what CI runs, and fails on
# anything it would have changed.
#
# `priority` is load-bearing where two formatters share a file type: prettier
# runs before markdownlint-cli2 on Markdown, the same order the editor applies
# them in.
#
# The `runtimeInputs` of `formatter` in flake.nix mirror the formatters here
# and change with them: a declared formatter without its binary is a hard
# error on every run.

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.css", "*.html", "*.json", "*.jsonc", "*.md", "*.yaml", "*.yml"]
excludes = [
  # Go templates, not HTML: actions inside tags (`<a href="{{ ... }}">`,
  # `</h{{ .Level }}>`) are SyntaxErrors to prettier's HTML parser, so one
  # layout fails the whole batch - and the layouts it can parse it reflows
  # across action boundaries, which changes rendered whitespace.
  "lib/hugo/layouts/**",
]
priority = 1

[formatter.markdownlint]
command = "markdownlint-cli2"
options = ["--fix"]
includes = ["*.md"]
excludes = [
  # The rendering fixture is test input, deliberately adversarial: adjacent
  # single-paragraph callouts must stay separate blockquotes for the hue
  # family to be judgeable (MD028). It is judged by looking at the preview.
  "lib/hugo/fixture/**",
]
priority = 2

[formatter.python]
command = "black"
options = ["--quiet"]
includes = ["*.py"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
